<section class="section section--descubre" id="descubre">
  <div class="container">
    <div class="section-header">
      <div>
        <p class="kicker">IDEAS PARA EL TRAYECTO</p>
        <h2 class="section-title">Descubre en el camino</h2>
        <p class="section-subtitle">Estas paradas son ejemplos de demostración para inspirar tu ruta con más historias y menos prisa.</p>
      </div>
      <span class="badge">DATOS DE DEMOSTRACIÓN</span>
    </div>

    <div class="tramos-control" data-tramos-control hidden>
      <span class="tramos-control__titulo">Dividir el viaje en</span>
      <div class="tramos-control__opciones tramos-control__opciones--ancho" data-tramos-opciones></div>
      <div class="tramos-mas" data-tramos-mas hidden>
        <label for="tramos-mas-numero">¿En cuántos tramos? (11 a 30)</label>
        <input type="number" id="tramos-mas-numero" min="11" max="30" step="1" placeholder="11" data-tramos-mas-numero />
        <button type="button" class="btn btn--primary" data-tramos-mas-aplicar>Aplicar</button>
      </div>
      <p class="tramos-control__nota" data-tramos-nota hidden></p>
    </div>

    <div class="lapsos" data-lapsos hidden></div>

    <div class="tramos-control tramos-control--tramo" data-tramo-proposito hidden>
      <span class="tramos-control__titulo" data-tramo-proposito-titulo></span>
      <div class="tramos-control__opciones tramos-control__opciones--largas" data-tramo-proposito-opciones></div>
    </div>

    <p class="linea-tiempo" data-linea-tiempo hidden></p>

    <div class="cards-grid" data-sugerencias>
      <p class="empty-state">Llena el formulario y calcula tu ruta para ver sugerencias de paradas.</p>
    </div>

    <button type="button" class="btn btn--ghost btn--ver-mas" data-ver-mas aria-expanded="false" hidden>
      <span data-ver-mas-texto>Ver más</span>
      <span class="btn--ver-mas__flecha" aria-hidden="true">▸</span>
    </button>
  </div>
</section>

<template id="tpl-sugerencia">
  <article class="card card--lugar" data-lugar-card>
    <span class="card__estrella" data-lugar-estrella hidden aria-label="Gastronomía reconocida" role="img">★</span>
    <div class="card__etiquetas">
      <span class="tag" data-lugar-categoria></span>
      <span class="tag tag--horas" data-lugar-horas hidden></span>
    </div>
    <h3 class="card__title" data-lugar-nombre></h3>
    <p class="card__subtitle" data-lugar-descripcion></p>
    <p class="card__nota-descanso" data-lugar-descanso hidden></p>
    <p class="card__nota-gastronomia" data-lugar-gastronomia hidden></p>
    <div class="card__acciones">
      <button type="button" class="btn btn--secondary btn--block" data-agregar-parada>Agregar parada</button>
      <button type="button" class="btn btn--ghost btn--block" data-descartar>Descartar</button>
    </div>
  </article>
</template>
